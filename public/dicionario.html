<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Dicionário · CAA</title>
  <link rel="icon" href="assets/logo-caa.png">
  <link rel="apple-touch-icon" href="assets/logo-caa.png">

  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div id="carregando" class="carregando-tela" aria-label="Carregando"><div class="bolinhas"><i></i><i></i><i></i></div></div>

  <div class="principal">
    <header class="topo">
      <div>
        <h1 class="saudacao">Dicionário</h1>
        <p class="subtitulo">O que foi comunicado, dia a dia.</p>
      </div>
      <div class="topo-acoes">
      </div>

    <main id="conteudo">

      <section class="painel" aria-labelledby="titulo-resumo">
        <h2 id="titulo-resumo">Resumo</h2>
        <p id="resumo" class="resumo-texto">Carregando…</p>
        <p class="texto-2 pequeno">Registro de uso para a família e os profissionais. Não é uma avaliação clínica.</p>
      </section>

        <p class="texto-2 pequeno">Toque numa figura para ouvir.</p>
        <div id="vocabulario" class="vocabulario"></div>
      </section>

      <section class="painel" aria-labelledby="titulo-historico">
        <h2 id="titulo-historico">Histórico de frases</h2>
        <div id="historico" class="historico"></div>
        <div class="mais"><button id="mais-historico" class="botao neutro" type="button" hidden>Ver frases mais antigas</button></div>

    <footer class="rodape">Comunicar é conectar. <i class="bi bi-heart-fill" aria-hidden="true"></i> · <a href="creditos.html">Créditos</a></footer>
