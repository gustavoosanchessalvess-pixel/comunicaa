<!doctype html>
<!--
  =====================================================================
  ENTRAR · login com Google ou com e-mail e senha (Supabase Auth)
  Comportamento: assets/js/login.js
  =====================================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Entre no CAA: comunicação com figuras PECS para pessoas autistas.">
  <meta name="theme-color" content="#f5f5f7">
  <title>Entrar · CAA</title>
  <link rel="icon" href="assets/logo-caa.png">
  <link rel="apple-touch-icon" href="assets/logo-caa.png">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/estilo.css">
  <script src="assets/js/config.js" defer></script>
  <script src="assets/vendor/supabase.js" defer></script>
  <script src="assets/js/base.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/login.js" defer></script>
</head>
<body>
  <main id="conteudo" class="pagina-entrada">
    <section class="entrada-cartao" aria-labelledby="titulo">
      <img class="entrada-logo" src="assets/logo-caa.png" alt="" width="104" height="104">
      <h1 id="titulo">Bem-vindo ao CAA</h1>
      <p class="subtitulo">Um espaço para se comunicar com facilidade e alegria.</p>

      <p id="aviso" class="aviso" role="status" aria-live="polite"></p>

      <!-- ENTRAR (padrão) -->
      <div id="bloco-entrar">
        <button id="entrar-google" class="botao-google" type="button">
          <!-- Logo oficial do "G" do Google (4 cores) -->
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continuar com Google
        </button>

        <div class="divisor">ou entre com e-mail</div>

        <form id="form-entrar" class="formulario" novalidate>
          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" class="entrada" type="email" autocomplete="email" inputmode="email" placeholder="seu@email.com" required>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" class="entrada" type="password" autocomplete="current-password" placeholder="Sua senha" required minlength="8">
          </div>
          <button id="botao-entrar" class="botao verde largo" type="submit"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar</button>
        </form>

        <p class="entrada-rodape">
          <button id="esqueci" class="link-botao" type="button">Esqueci minha senha</button>
        </p>
        <p class="entrada-rodape">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
      </div>

      <!-- NOVA SENHA (aparece só quando a pessoa volta pelo link "esqueci minha senha") -->
      <form id="form-nova-senha" class="formulario" hidden novalidate>
        <h2>Criar nova senha</h2>
        <div class="campo">
          <label for="nova-senha">Nova senha</label>
          <input id="nova-senha" class="entrada" type="password" autocomplete="new-password" minlength="8" required placeholder="Pelo menos 8 caracteres">
        </div>
        <div class="campo">
          <label for="nova-senha-2">Repita a nova senha</label>
          <input id="nova-senha-2" class="entrada" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="botao azul largo" type="submit"><i class="bi bi-shield-lock-fill" aria-hidden="true"></i> Salvar nova senha</button>
      </form>

      <p class="entrada-rodape pequeno"><a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos de Uso</a> · <a href="creditos.html">Créditos</a></p>
    </section>
  </main>
</body>
</html>
