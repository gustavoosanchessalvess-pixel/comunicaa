<!doctype html>
<!--
  =====================================================================
  TABELAS · as categorias do banco (tabela CATEGORIA + ligações TEM)
  Comportamento: assets/js/tabelas.js
  =====================================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Tabelas · CAA</title>
  <link rel="icon" href="assets/logo-caa.png">
  <link rel="apple-touch-icon" href="assets/logo-caa.png">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/estilo.css">
  <script src="assets/js/config.js" defer></script>
  <script src="assets/vendor/supabase.js" defer></script>
  <script src="assets/js/base.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/interface.js" defer></script>
  <script src="assets/js/catalogo.js" defer></script>
  <script src="assets/js/tabelas.js" defer></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div id="carregando" class="carregando-tela" aria-label="Carregando"><div class="bolinhas"><i></i><i></i><i></i></div></div>

  <div class="principal">
    <header class="topo">
      <div>
        <h1 class="saudacao">Tabelas</h1>
        <p class="subtitulo">Escolha um assunto para conversar.</p>
      </div>
      <div class="topo-acoes">
        <button id="foco" class="botao-foco" type="button" aria-pressed="false">
          <i class="bi bi-stars" aria-hidden="true"></i><span>Modo Foco</span><span class="interruptor" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main id="conteudo">
      <label class="busca ferramentas" for="busca-tabela">
        <span class="so-leitor">Buscar uma tabela</span>
        <i class="bi bi-search" aria-hidden="true"></i>
        <input id="busca-tabela" class="entrada" type="search" placeholder="Buscar uma tabela (ex.: comidas)" autocomplete="off">
      </label>

      <section aria-labelledby="titulo-assuntos">
        <div class="titulo-secao">
          <span class="icone i-tabelas" aria-hidden="true"><i class="bi bi-grid-3x3-gap-fill"></i></span>
          <h2 id="titulo-assuntos">Assuntos</h2>
        </div>
        <div id="lista-assuntos" class="grade-tabelas"></div>
      </section>

      <section id="secao-cores" aria-labelledby="titulo-cores">
        <div class="titulo-secao">
          <span class="icone i-dicionario" aria-hidden="true"><i class="bi bi-palette-fill"></i></span>
          <div>
            <h2 id="titulo-cores">Cores das palavras</h2>
            <p class="texto-2 pequeno">Cada cor é um tipo de palavra (chave de Fitzgerald).</p>
          </div>
        </div>
        <div id="lista-cores" class="grade-tabelas"></div>
      </section>

      <p id="sem-resultado" class="estado-vazio" hidden><i class="bi bi-search" aria-hidden="true"></i>Nenhuma tabela com esse nome.</p>
    </main>

    <footer class="rodape">Comunicar é conectar. <i class="bi bi-heart-fill" aria-hidden="true"></i> · <a href="creditos.html">Créditos</a></footer>
  </div>
</body>
</html>
